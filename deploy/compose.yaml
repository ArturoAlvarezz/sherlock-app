# Stack de Sherlock. El workflow de CI/CD (.github/workflows/ci-cd.yml) lo copia a /opt/stacks/sherlock-app (producción)
# o /opt/stacks/sherlock-app-pruebas y lo levanta con IMAGEN, CONTENEDOR y PUERTO definidos.
services:
  sherlock-app:
    image: ${IMAGEN:?IMAGEN no definida}
    container_name: ${CONTENEDOR:?CONTENEDOR no definido}
    restart: always
    env_file:
      - .env
    environment:
      SHERLOCK_TIMEOUT: "120"
      SHERLOCK_IGNORE_EXCLUSIONS: "true"
    volumes:
      # DATOS en el .env de producción apunta a la carpeta de siempre; pruebas usa ./data.
      - ${DATOS:-./data}:/app/data
    ports:
      - "127.0.0.1:${PUERTO:?PUERTO no definido}:8000"
    labels:
      com.centurylinklabs.watchtower.enable: "false" # la imagen es local; la actualiza el CI/CD, no Watchtower
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
