services:
  app:
    image: sherlock-app:test
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: sherlock-app-test
    volumes:
      - ./backend/data:/app/data
    environment:
      SHERLOCK_TIMEOUT: ${SHERLOCK_TIMEOUT:-120}
      SHERLOCK_IGNORE_EXCLUSIONS: ${SHERLOCK_IGNORE_EXCLUSIONS:-true}
    ports:
      - "8080:8000"
    restart: unless-stopped
